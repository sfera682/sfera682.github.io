<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог фасадов — SFERA PROM KZ</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .catalog-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        
        /* Стили для категорий */
        .category-section { margin-bottom: 40px; }
        .category-title { 
            font-size: 1.4em; 
            color: #444; 
            margin-bottom: 20px; 
            padding-bottom: 10px;
            border-bottom: 2px solid #ddd;
        }
        
        .catalog-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 15px; 
        }
        .product-card { 
            background: white;
            border: 1px solid #eee; 
            padding: 8px; 
            text-align: center; 
            border-radius: 6px; 
            transition: transform 0.2s;
        }
        .product-card:hover { transform: scale(1.03); border: 1px solid #333; }
        .product-card img { width: 100%; height: 100px; object-fit: cover; border-radius: 4px; display: block; }
        .product-name { display: block; margin-top: 8px; font-size: 0.8em; color: #333; font-weight: bold; }
    </style>
</head>
<body>

    <header class="container">
        <div class="logo">SFERA PROM KZ</div>
        <nav>
            <a href="index.html" class="nav-link">ГЛАВНАЯ</a>
            <a href="works.html" class="nav-link">РАБОТЫ</a>
            <a href="catalog1.html" class="nav-link">СТОЛЕШНИЦЫ</a>
            <a href="catalog2.html" class="nav-link active">ФАСАДЫ</a>
        </nav>
        <div class="header-phone">+7 776 068 04 58</div>
    </header>

    <main class="catalog-container">
        <h1>Каталог фасадов</h1>

        <section class="category-section">
            <h2 class="category-title">Древесные декоры</h2>
            <div class="catalog-grid">
                <div class="product-card"><img src="assets/img/akaciasvetl.jpg" alt="Акация светлая"><span class="product-name">Акация светлая</span></div>
                <div class="product-card"><img src="assets/img/dubsonoma.jpg" alt="Дуб сонома"><span class="product-name">Дуб сонома</span></div>
                <div class="product-card"><img src="assets/img/yasenshimotemn.jpg" alt="Ясень шимо темный"><span class="product-name">Ясень шимо темный</span></div>
                <div class="product-card"><img src="assets/img/venge.jpg" alt="Венге"><span class="product-name">Венге</span></div>
                </div>
        </section>

        <section class="category-section">
            <h2 class="category-title">Текстурные декоры</h2>
            <div class="catalog-grid">
                <div class="product-card"><img src="assets/img/betonpain.jpg" alt="Бетон пайн"><span class="product-name">Бетон пайн</span></div>
                <div class="product-card"><img src="assets/img/cementsvetli.jpg" alt="Цемент светлый"><span class="product-name">Цемент светлый</span></div>
                <div class="product-card"><img src="assets/img/loft.jpg" alt="Лофт"><span class="product-name">Лофт</span></div>
                <div class="product-card"><img src="assets/img/kamen.jpg" alt="Камень"><span class="product-name">Камень</span></div>
                </div>
        </section>

        <section class="category-section">
            <h2 class="category-title">Однотонные декоры</h2>
            <div class="catalog-grid">
                <div class="product-card"><img src="assets/img/beli.jpg" alt="Белый"><span class="product-name">Белый</span></div>
                <div class="product-card"><img src="assets/img/chemi.jpg" alt="Черный"><span class="product-name">Черный</span></div>
                <div class="product-card"><img src="assets/img/krasni.jpg" alt="Красный"><span class="product-name">Красный</span></div>
                <div class="product-card"><img src="assets/img/sini.jpg" alt="Синий"><span class="product-name">Синий</span></div>
                <div class="product-card"><img src="assets/img/zhelti.jpg" alt="Желтый"><span class="product-name">Желтый</span></div>
                </div>
        </section>

    </main>

    <div id="footer-placeholder"></div>

    <script>
        fetch('footer.html').then(r => r.text()).then(d => document.getElementById('footer-placeholder').innerHTML = d);
    </script>
</body>
</html>
