<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог фасадов — SFERA PROM KZ</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="catalog2.css">
</head>
<body>
    <header class="container">
        <div class="logo">SFERA PROM KZ</div>
        <nav>
            <a href="index.html" class="nav-link">ГЛАВНАЯ</a>
            <a href="works.html" class="nav-link">РАБОТЫ</a>
            <a href="catalog1.html" class="nav-link">СТОЛЕШНИЦЫ</a>
            <a href="catalog2.html" class="nav-link active">ФАСАДЫ</a>
        </nav>
        <div class="header-phone">+7 776 068 04 58</div>
    </header>

    <main class="catalog-container">
        <h1>Каталог фасадов</h1>

        <section class="category-section">
            <details open>
                <summary class="category-title">Древесные <span>▼</span></summary>
                <div class="catalog-grid">
                    <div class="product-card"><img src="assets/akaciasvetl.jpg" alt="Акация Светлая"><span class="product-name">Акация Светлая</span></div>
                    </div>
            </details>
        </section>

        <section class="category-section">
            <details>
                <summary class="category-title">Фантазийные <span>▼</span></summary>
                <div class="catalog-grid">
                    <div class="product-card"><img src="assets/betonpain.jpg" alt="Бетон Пайн"><span class="product-name">Бетон Пайн</span></div>
                </div>
            </details>
        </section>

        <section class="category-section">
            <details>
                <summary class="category-title">Фоновые <span>▼</span></summary>
                <div class="catalog-grid">
                    <div class="product-card"><img src="assets/alyuminii.jpg" alt="Алюминий"><span class="product-name">Алюминий</span></div>
                </div>
            </details>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script>
        fetch('footer.html').then(r => r.text()).then(d => document.getElementById('footer-placeholder').innerHTML = d);
    </script>
</body>
</html>
