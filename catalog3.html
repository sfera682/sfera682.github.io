<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог фасадов МДФ — SFERA PROM KZ</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="catalog3.css">
</head>
<body>
    <header class="container">
        <div class="logo">SFERA PROM KZ</div>
        <nav>
            <a href="index.html" class="nav-link">ГЛАВНАЯ</a>
            <a href="works.html" class="nav-link">РАБОТЫ</a>
            <a href="catalog1.html" class="nav-link">СТОЛЕШНИЦЫ И ФАРТУКИ</a>
            <a href="catalog2.html" class="nav-link">ФАСАДЫ ЛДСП</a>
            <a href="catalog3.html" class="nav-link active">ФАСАДЫ МДФ</a>
        </nav>
        <div class="header-phone">+7 776 068 04 58</div>
    </header>

    <main class="catalog-container">
        <h1>Каталог фасадов МДФ</h1>
        <p style="text-align: center; margin-bottom: 30px;">Выберите вид фрезеровки, чтобы увидеть доступные варианты.</p>

        <!-- КАТЕГОРИИ ФАСАДОВ (ВИДЫ РЕЗКИ) -->
        
        <section class="category-section">
            <details open>
                <summary class="category-title">Классические и рамочные фасады <span>▼</span></summary>
                <div class="catalog-grid">
                    <div class="product-card"><img src="assets/mdf/gaudi.webp" alt="Gaudi"></div>
                    <div class="product-card"><img src="assets/mdf/lux.webp" alt="Lux"></div>
                    <div class="product-card"><img src="assets/mdf/lux1.webp" alt="Lux 1"></div>
                    <div class="product-card"><img src="assets/mdf/lux2.webp" alt="Lux 2"></div>
                    <div class="product-card"><img src="assets/mdf/rez1.webp" alt="Резной 1"></div>
                    <div class="product-card"><img src="assets/mdf/rez2.webp" alt="Резной 2"></div>
                    <div class="product-card"><img src="assets/mdf/rez3.webp" alt="Резной 3"></div>
                    <div class="product-card"><img src="assets/mdf/rez4.webp" alt="Резной 4"></div>
                    <div class="product-card"><img src="assets/mdf/rez5.webp" alt="Резной 5"></div>
                    <div class="product-card"><img src="assets/mdf/ri1.webp" alt="Рибера 1"></div>
                    <div class="product-card"><img src="assets/mdf/ri2.webp" alt="Рибера 2"></div>
                </div>
            </details>
        </section>

        <section class="category-section">
            <details>
                <summary class="category-title">Линейные и рельефные <span>▼</span></summary>
                <div class="catalog-grid">
                    <div class="product-card"><img src="assets/mdf/1(1).webp" alt="Волна 1"></div>
                    <div class="product-card"><img src="assets/mdf/1(2).webp" alt="Волна 2"></div>
                    <div class="product-card"><img src="assets/mdf/11.webp" alt="Полосы 11"></div>
                    <div class="product-card"><img src="assets/mdf/12.webp" alt="Полосы 12"></div>
                    <div class="product-card"><img src="assets/mdf/13.webp" alt="Полосы 13"></div>
                    <div class="product-card"><img src="assets/mdf/rif1.webp" alt="Риф 1"></div>
                    <div class="product-card"><img src="assets/mdf/rif2.webp" alt="Риф 2"></div>
                    <div class="product-card"><img src="assets/mdf/rif3.webp" alt="Риф 3"></div>
                </div>
            </details>
        </section>

        <section class="category-section">
            <details>
                <summary class="category-title">Геометрические и узорные <span>▼</span></summary>
                <div class="catalog-grid">
                    <div class="product-card"><img src="assets/mdf/ne1.webp" alt="Узор 1"></div>
                    <div class="product-card"><img src="assets/mdf/ne2.webp" alt="Узор 2"></div>
                    <div class="product-card"><img src="assets/mdf/ne3.webp" alt="Узор 3"></div>
                    <div class="product-card"><img src="assets/mdf/ne4.webp" alt="Узор 4"></div>
                </div>
            </details>
        </section>

        <section class="category-section">
            <details>
                <summary class="category-title">Гладкие фасады <span>▼</span></summary>
                <div class="catalog-grid">
                    <div class="product-card"><img src="assets/mdf/1.webp" alt="Гладкий 1"></div>
                    <div class="product-card"><img src="assets/mdf/2.webp" alt="Гладкий 2"></div>
                </div>
            </details>
        </section>

    </main>

    <div id="footer-placeholder"></div>
    <script>
        fetch('footer.html').then(r => r.text()).then(d => document.getElementById('footer-placeholder').innerHTML = d);
    </script>
</body>
</html>
